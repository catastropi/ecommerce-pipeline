name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint/test tooling
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint (flake8)
        # 전체 룰을 빡빡하게 걸진 않고 실제 버그로 이어지는 항목
        # (문법 오류, 미사용 import 등) 위주로만 본다.
        run: |
          flake8 dags api \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=dags/data,dags/config/__pycache__

      - name: Run unit tests
        run: |
          pip install -r api/requirements.txt
          # test_api_ingest.py가 FastAPI TestClient로 /ingest/orders를 검증하는데
          # 필요한 패키지. api/requirements.txt에는 런타임 필수가 아니라서 안 넣음.
          pip install httpx
          # 실제 Postgres/Spark 클러스터가 필요 없는 테스트만 CI에서 돌린다.
          # (DB 커넥션은 monkeypatch/mock으로 대체, SQL 문자열 생성 로직만 검증)
          # test_spark_aggregations.py / test_spark_transformations.py는 pyspark(JVM)
          pytest \
            tests/test_api_ingest.py \
            tests/test_dw_loader.py \
            tests/test_quality_check.py \
            tests/test_data_validation.py \
            tests/test_incremental_ingest.py \
            -v --maxfail=1

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Airflow image
        run: docker build -t ecommerce-pipeline-airflow:ci .

      - name: Build FastAPI image
        run: docker build -t ecommerce-pipeline-api:ci ./api
