<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce Data Platform Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/dashboard.css" />
</head>
<body>
<header class="topbar">
    <div>
        <span class="wordmark">Ecommerce Data Platform</span>
        <h1>Olist Sales Dashboard</h1>
    </div>
    <a class="docs-link" href="/docs" target="_blank" rel="noopener">API 문서 (Swagger)</a>
</header>

<main class="dashboard">

    <!-- KPI 원장(ledger) 스트립 -->
    <div class="kpi-strip" id="kpi-cards">
        <div class="kpi-cell">
            <p class="kpi-label">총 매출</p>
            <p class="kpi-value" id="kpi-revenue">-</p>
        </div>
        <div class="kpi-cell">
            <p class="kpi-label">평균 주문금액</p>
            <p class="kpi-value" id="kpi-aov">-</p>
        </div>
        <div class="kpi-cell">
            <p class="kpi-label">재구매율</p>
            <p class="kpi-value" id="kpi-repurchase">-</p>
        </div>
        <div class="kpi-cell">
            <p class="kpi-label">평균 배송일 / 환불률</p>
            <p class="kpi-value" id="kpi-delivery">-</p>
        </div>
    </div>

    <div class="panel-grid cols-2">
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">일별 매출 추이 (누적 매출 / 이동평균 포함)</h2>
                <span class="panel-grain">DAY · ITEM SUM</span>
            </div>
            <div class="panel-body">
                <canvas id="dailySalesChart" height="90"></canvas>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">카테고리별 매출</h2>
                <span class="panel-grain">TOP 8</span>
            </div>
            <div class="panel-body">
                <canvas id="categoryChart" height="90"></canvas>
            </div>
        </div>
    </div>

    <div class="panel-grid cols-3">
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">지역별 매출</h2>
                <span class="panel-grain">STATE</span>
            </div>
            <div class="panel-body">
                <canvas id="regionChart" height="110"></canvas>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">시간대별 주문 건수</h2>
                <span class="panel-grain">HOUR · ORDER COUNT</span>
            </div>
            <div class="panel-body">
                <canvas id="hourlyChart" height="110"></canvas>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Top 상품 (매출 기준)</h2>
                <span class="panel-grain">TOP 10</span>
            </div>
            <div class="panel-body flush">
                <table class="data-table" id="topProductsTable">
                    <thead>
                    <tr>
                        <th>상품 ID</th>
                        <th>카테고리</th>
                        <th class="num">매출</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="/static/dashboard.js"></script>
</body>
</html>
